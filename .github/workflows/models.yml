name: models

# Every model must still download from each source the app knows, or a fresh install
# loses it once its other sources are gone. The check downloads all of them (about
# 3 GB), so it runs weekly and when the sources change, not on every pull request.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - app/model_catalog.json
      - app/model_cache.py
      - tools/models.py
      - .github/workflows/models.yml

permissions:
  contents: read

# A newer push cancels a pull request's check; the weekly run on main is never cut
# short by a manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sources:
    name: model sources
    runs-on: ubuntu-latest
    # A run takes about 4 minutes. The check stops trying sources after 100 minutes
    # (BUDGET in tools/models.py), so its summary and the artifact come before this.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Download every model from each source
        # The default folder, data/models, is where a checkout keeps the local copy, so
        # the upload commands printed on a failure name the right files. --frozen: a
        # lock that a release left behind its version must not stop the check.
        run: uv run --frozen python -u -m tools.models
      - name: Keep the models a failed run asks to upload
        # Only those, linked into data/models/upload by the check. Unpacked into
        # data/models, they go to the mirror with the printed commands.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: data/models/upload
          if-no-files-found: ignore
          retention-days: 90
