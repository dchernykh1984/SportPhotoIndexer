name: models

# Every model must still download from each source the app knows, or a fresh install
# loses it once its other sources are gone. The check downloads all of them (about
# 3 GB), so it runs weekly and when the sources change, not on every pull request.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - app/model_catalog.json
      - app/model_cache.py
      - tools/models.py
      - .github/workflows/models.yml

permissions:
  contents: read

jobs:
  sources:
    name: model sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Download every model from each source
        # Into data/models, the folder the printed upload commands name on a checkout.
        run: uv run --locked python -u -m tools.models
